[package]
name = "lift-app"
version = "0.1.0"
edition = "2021"

[dependencies]
lift-core = { path = "../lift-core" }
# Минимальный набор фич для 3D PBR-приложения (T05, §4.1).
# Имена фич сверены с bevy-0.20.0/Cargo.toml (не по памяти):
#  - std/multi_threaded/async_executor — планировщик и пулы задач;
#  - bevy_winit → bevy_window — окно и ввод;
#  - bevy_asset — ассеты (мешов), bevy_log — info!-логи;
#  - bevy_render/core_pipeline/pbr — 3D PBR-пайплайн;
#  - bevy_gizmos(_render) — трейлы и луч (T02/T04);
#  - webgl2 — фолбэк-бэкенд (совместимость);
#  - tonemapping_luts — корректный тонмаппинг PBR (тянет ktx2+zstd).
bevy = { version = "0.20", default-features = false, features = [
    "std",
    "multi_threaded",
    "async_executor",
    "bevy_winit",
    "bevy_asset",
    "bevy_log",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "webgl2",
    "tonemapping_luts",
    # бэкенд zstd для ktx2-LUT тонмаппинга (чистый Rust, кроссплатформенный)
    "zstd_rust",
    "debug", # ВРЕМЕННО T05-диагностика: имена систем в ошибках ECS
] }
# Только dim3: async-collider/debug-render/picking не используются
# (коллайдеры спавнятся вручную, отладка — bevy_gizmos).
bevy_rapier3d = { version = "0.37", default-features = false, features = [
    "dim3",
] }
# Учебный UI (T06). Минимальный набор фич: render + default_fonts.
# Выключены (экономия ~1.5 МБ gzip): manage_clipboard (нет текстовых
# полей), open_url, bevy_ui (свой UI не используется), picking,
# accesskit, serde (строки локализации в ui/strings.rs, не JSON).
bevy_egui = { version = "0.43", default-features = false, features = [
    "render",
    "default_fonts",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
